name: Sync Lean data

on:
  schedule:
    - cron: "17 6 * * *"   # daily, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: sync-lean
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/sync_lean.py
      - run: python3 tools/validate.py
      - name: Commit if changed
        id: commit
        run: |
          if [ -z "$(git status --porcelain -- data)" ]; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          git commit -m "Sync Lean data"
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"
      # Pushes made with GITHUB_TOKEN may not start a Pages build, so ask for one.
      - name: Rebuild GitHub Pages
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "::warning::Could not request a Pages build"
