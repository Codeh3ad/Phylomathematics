name: Validate data

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/validate.py
      - name: Check asset versions are current
        run: |
          python3 tools/bump_version.py
          git diff --exit-code index.html || { echo "::error::Run python3 tools/bump_version.py and commit index.html"; exit 1; }
